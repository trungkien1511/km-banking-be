spring.application.name=km-banking-be
spring.profiles.active=dev

server.port=8080

# JPA Common
spring.jpa.hibernate.ddl-auto=none


# JWT
jwt.secret=${JWT_SECRET:kmBankSecretKeyForJWTAuthMustBeAtLeast256BitsLongForHS256Algorithm}
jwt.expiration-seconds=900
jwt.refresh-expiration-days=7

# Anti Brute-Force Protection
auth.security.max-failed-attempts=5
auth.security.lock-duration-minutes=15

# System account number used as the counterparty for deposits and withdrawals
kmbank.system-account-number=SYSTEM-000

# Reconciliation: how many minutes a PENDING transaction must be "stuck"
# before the scheduler marks it COMPLETED (has ledger entries) or FAILED (no entries).
# Increase this value if you have legitimate long-running transactions.
kmbank.reconciliation.pending-threshold-minutes=15
